<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Controle de Estoque</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
*{box-sizing:border-box;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
body{margin:0;background:#f2f4f7;color:#222}
header{background:#1e3a8a;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px;margin:0}
.tabs{display:flex;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:5}
.tabs button{flex:1;padding:12px 4px;border:0;background:none;font-weight:600;font-size:13px;color:#555}
.tabs button.ativo{color:#1e3a8a;border-bottom:3px solid #1e3a8a}
section{display:none;padding:14px}section.ativo{display:block}
.btn{padding:10px 14px;border:0;border-radius:8px;background:#1e3a8a;color:#fff;font-weight:600;font-size:14px;cursor:pointer}
.btn.sec{background:#e5e7eb;color:#222}.btn.verde{background:#16a34a}.btn.verm{background:#dc2626}
.btn.full{width:100%;margin-top:8px}
input,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:16px;margin-top:4px}
label{font-size:13px;font-weight:600;display:block;margin-top:10px}
.linha{display:flex;gap:8px;align-items:center}.linha>*{flex:1}
.card{background:#fff;border-radius:10px;padding:10px;margin-top:10px;display:flex;gap:10px;align-items:center;box-shadow:0 1px 3px #0001}
.card img,.semfoto{width:64px;height:64px;object-fit:cover;border-radius:8px;background:#e5e7eb;flex:none}
.card .info{flex:1;font-size:14px}.card .info b{display:block}
.peq{font-size:12px;color:#666}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
.modal.ativo{display:flex}
.caixa{background:#fff;border-radius:12px;padding:16px;width:100%;max-width:460px;max-height:92vh;overflow:auto}
#leitor{width:100%;min-height:240px;background:#000;border-radius:8px;overflow:hidden}
#login{max-width:360px;margin:60px auto;background:#fff;padding:20px;border-radius:12px}
#app{display:none}
.prev{width:100%;max-height:200px;object-fit:contain;margin-top:8px;border-radius:8px}
.msg{padding:8px;border-radius:8px;margin-top:8px;font-size:14px}
.ok{background:#dcfce7}.erro{background:#fee2e2}
#carregando{position:fixed;inset:0;background:#fff9;display:none;align-items:center;justify-content:center;z-index:30;font-weight:700}
</style>
</head>
<body>

<div id="carregando">Aguarde...</div>

<!-- LOGIN -->
<div id="login">
  <h2>Entrar</h2>
  <label>E-mail</label><input id="email" type="email" autocomplete="username">
  <label>Senha</label><input id="senha" type="password" autocomplete="current-password">
  <button class="btn full" onclick="entrar()">Entrar</button>
  <div id="loginMsg"></div>
</div>

<!-- APP -->
<div id="app">
  <header><h1>Controle de Estoque</h1>
    <div><button class="btn sec" onclick="carregar()">⟳</button> <button class="btn sec" onclick="sair()">Sair</button></div>
  </header>
  <div class="tabs">
    <button class="ativo" onclick="aba('tudo',this)">TUDO</button>
    <button onclick="aba('leitura',this)">LEITURA DE ESTOQUE</button>
    <button onclick="aba('contagem',this)">CONTAGEM</button>
  </div>

  <!-- TUDO -->
  <section id="tudo" class="ativo">
    <input id="busca" placeholder="Buscar por nome ou código" oninput="renderTudo()">
    <div class="acoes">
      <button class="btn" onclick="abrirProduto()">+ Produto</button>
      <button class="btn sec" onclick="relProdutos('pdf')">PDF</button>
      <button class="btn sec" onclick="relProdutos('xlsx')">Excel</button>
    </div>
    <div id="listaProdutos"></div>
  </section>

  <!-- LEITURA -->
  <section id="leitura">
    <button class="btn full" onclick="abrirScanner(c=>buscarLeitura(c))">📷 Ler código de barras</button>
    <label>Ou digite o código</label>
    <div class="linha"><input id="codLeitura"><button class="btn" style="flex:none" onclick="buscarLeitura(codLeitura.value)">Buscar</button></div>
    <div id="resLeitura"></div>
  </section>

  <!-- CONTAGEM -->
  <section id="contagem">
    <h3 style="margin:4px 0">Contagem rápida</h3>
    <label>Código</label>
    <div class="linha"><input id="cCod" oninput="mostrarNomeCont()"><button class="btn" style="flex:none" onclick="abrirScanner(c=>{cCod.value=c;mostrarNomeCont()})">📷</button></div>
    <div id="cNome" class="peq"></div>
    <label>Quantidade contada</label><input id="cQtd" type="number" inputmode="numeric">
    <label>Observação</label><input id="cObs">
    <label>Foto</label><input id="cFoto" type="file" accept="image/*" capture="environment" onchange="preview(this,'cPrev')">
    <img id="cPrev" class="prev" style="display:none">
    <label style="font-weight:400"><input type="checkbox" id="cAplicar" style="width:auto"> Atualizar estoque do produto com esta quantidade</label>
    <button class="btn verde full" onclick="registrarContagem()">Registrar contagem</button>
    <div class="acoes">
      <button class="btn sec" onclick="relContagens('pdf')">PDF</button>
      <button class="btn sec" onclick="relContagens('xlsx')">Excel</button>
    </div>
    <div id="listaContagens"></div>
  </section>
</div>

<!-- MODAL PRODUTO -->
<div class="modal" id="mProduto"><div class="caixa">
  <h3 id="mTitulo">Produto</h3>
  <input type="hidden" id="pId">
  <label>Código de barras</label>
  <div class="linha"><input id="pCod"><button class="btn" style="flex:none" onclick="abrirScanner(c=>pCod.value=c)">📷</button></div>
  <label>Nome</label><input id="pNome">
  <label>Quantidade em estoque</label><input id="pQtd" type="number" inputmode="numeric">
  <label>Foto</label><input id="pFoto" type="file" accept="image/*" capture="environment" onchange="preview(this,'pPrev')">
  <img id="pPrev" class="prev" style="display:none">
  <button class="btn verde full" onclick="salvarProduto()">Salvar</button>
  <button class="btn sec full" onclick="fechar('mProduto')">Cancelar</button>
</div></div>

<!-- MODAL SCANNER -->
<div class="modal" id="mScanner"><div class="caixa">
  <h3>Aponte para o código</h3>
  <div id="leitor"></div>
  <button class="btn sec full" onclick="fecharScanner()">Fechar</button>
</div></div>

<script>
// ================= CONFIGURAÇÃO =================
const SB_URL='https://yxgmbrpsssdtuqnobtmr.supabase.co';
const SB_KEY='sb_publishable_uSjxyspXOj6PUb3E7SlTig_U_1BcAHv';
const CFG={tabela:'app_estado',colId:'id',colDados:'dados',idEstado:'principal',
  bucketProd:'fotos-produtos',bucketCont:'fotos-contagem'};
// =================================================

const sb=supabase.createClient(SB_URL,SB_KEY);
let estado={produtos:[],contagens:[]};
const urlCache={};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load=v=>$('carregando').style.display=v?'flex':'none';

// ---------- LOGIN ----------
async function entrar(){
  load(1);
  const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('senha').value});
  load(0);
  if(error){$('loginMsg').innerHTML=`<div class="msg erro">${esc(error.message)}</div>`;return;}
  iniciar();
}
async function sair(){await sb.auth.signOut();location.reload();}
async function iniciar(){$('login').style.display='none';$('app').style.display='block';await carregar();}
sb.auth.getSession().then(({data})=>{if(data.session)iniciar();});

// ---------- DADOS ----------
async function carregar(){
  load(1);
  const {data,error}=await sb.from(CFG.tabela).select(CFG.colDados).eq(CFG.colId,CFG.idEstado).maybeSingle();
  load(0);
  if(error){alert('Erro ao carregar: '+error.message);return;}
  if(data&&data[CFG.colDados])estado=Object.assign({produtos:[],contagens:[]},data[CFG.colDados]);
  renderTudo();renderContagens();
}
async function salvar(){
  const row={};row[CFG.colId]=CFG.idEstado;row[CFG.colDados]=estado;
  const {error}=await sb.from(CFG.tabela).upsert(row);
  if(error)alert('Erro ao salvar: '+error.message);
}

// ---------- FOTOS (Storage) ----------
function comprimir(file,max=900){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{const r=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=img.width*r;c.height=img.height*r;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(res,'image/jpeg',0.75);};
    img.onerror=rej;img.src=URL.createObjectURL(file);
  });
}
async function enviarFoto(bucket,file){
  const blob=await comprimir(file);
  const path=`${Date.now()}_${Math.random().toString(36).slice(2,8)}.jpg`;
  const {error}=await sb.storage.from(bucket).upload(path,blob,{contentType:'image/jpeg'});
  if(error)throw error;
  return path;
}
async function urlFoto(bucket,path){
  if(!path)return '';
  const k=bucket+'/'+path;if(urlCache[k])return urlCache[k];
  const {data}=await sb.storage.from(bucket).createSignedUrl(path,3600);
  return urlCache[k]=data?.signedUrl||'';
}
async function apagarFoto(bucket,path){if(path)await sb.storage.from(bucket).remove([path]);}
function preencherFotos(){
  document.querySelectorAll('img[data-p]').forEach(async im=>{im.src=await urlFoto(im.dataset.b,im.dataset.p);im.removeAttribute('data-p');});
}
const imgTag=(b,p)=>p?`<img data-b="${b}" data-p="${esc(p)}">`:`<div class="semfoto"></div>`;
function preview(inp,id){const f=inp.files[0];const im=$(id);if(f){im.src=URL.createObjectURL(f);im.style.display='block';}}

// ---------- ABAS ----------
function aba(id,b){
  document.querySelectorAll('section').forEach(s=>s.classList.remove('ativo'));
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('ativo'));
  $(id).classList.add('ativo');b.classList.add('ativo');
}
function fechar(id){$(id).classList.remove('ativo');}

// ---------- SCANNER (funciona no iPhone) ----------
let scanner=null;
async function abrirScanner(cb){
  $('mScanner').classList.add('ativo');
  const F=Html5QrcodeSupportedFormats;
  scanner=new Html5Qrcode('leitor',{verbose:false,
    formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.CODE_39,F.ITF,F.QR_CODE]});
  try{
    await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:140}},
      txt=>{fecharScanner();if(navigator.vibrate)navigator.vibrate(100);cb(txt.trim());});
  }catch(e){alert('Não foi possível abrir a câmera. Verifique a permissão e se o site está em HTTPS.\n'+e);fecharScanner();}
}
async function fecharScanner(){
  if(scanner){try{await scanner.stop();}catch{}try{scanner.clear();}catch{}scanner=null;}
  fechar('mScanner');
}

// ---------- PRODUTOS ----------
const porCodigo=c=>estado.produtos.find(p=>p.codigo===String(c).trim());
function renderTudo(){
  const q=($('busca').value||'').toLowerCase();
  const l=estado.produtos.filter(p=>(p.nome+' '+p.codigo).toLowerCase().includes(q));
  $('listaProdutos').innerHTML=l.length?l.map(p=>`
    <div class="card">${imgTag(CFG.bucketProd,p.foto)}
      <div class="info"><b>${esc(p.nome)}</b><span class="peq">${esc(p.codigo)}</span><br>Estoque: <b style="display:inline">${p.qtd??0}</b></div>
      <div><button class="btn sec" onclick="abrirProduto('${p.id}')">✏️</button>
      <button class="btn verm" onclick="excluirProduto('${p.id}')">🗑</button></div>
    </div>`).join(''):'<p class="peq">Nenhum produto.</p>';
  preencherFotos();
}
function abrirProduto(id,codigo){
  const p=estado.produtos.find(x=>x.id===id)||{};
  $('mTitulo').textContent=id?'Editar produto':'Novo produto';
  $('pId').value=p.id||'';$('pCod').value=p.codigo||codigo||'';$('pNome').value=p.nome||'';$('pQtd').value=p.qtd??'';
  $('pFoto').value='';$('pPrev').style.display='none';
  if(p.foto)urlFoto(CFG.bucketProd,p.foto).then(u=>{$('pPrev').src=u;$('pPrev').style.display='block';});
  $('mProduto').classList.add('ativo');
}
async function salvarProduto(){
  const id=$('pId').value,codigo=$('pCod').value.trim(),nome=$('pNome').value.trim();
  if(!nome){alert('Informe o nome');return;}
  const dup=porCodigo(codigo);if(codigo&&dup&&dup.id!==id){alert('Já existe produto com esse código');return;}
  load(1);
  try{
    let p=estado.produtos.find(x=>x.id===id);
    if(!p){p={id:crypto.randomUUID(),criado:new Date().toISOString()};estado.produtos.push(p);}
    const f=$('pFoto').files[0];
    if(f){const novo=await enviarFoto(CFG.bucketProd,f);await apagarFoto(CFG.bucketProd,p.foto);p.foto=novo;}
    Object.assign(p,{codigo,nome,qtd:Number($('pQtd').value)||0});
    await salvar();fechar('mProduto');renderTudo();
  }catch(e){alert('Erro: '+e.message);}
  load(0);
}
async function excluirProduto(id){
  if(!confirm('Excluir este produto?'))return;
  const p=estado.produtos.find(x=>x.id===id);
  load(1);await apagarFoto(CFG.bucketProd,p?.foto);
  estado.produtos=estado.produtos.filter(x=>x.id!==id);await salvar();load(0);renderTudo();
}

// ---------- LEITURA DE ESTOQUE ----------
function buscarLeitura(c){
  c=String(c||'').trim();$('codLeitura').value=c;if(!c)return;
  const p=porCodigo(c);
  if(!p){$('resLeitura').innerHTML=`<div class="msg erro">Código <b>${esc(c)}</b> não cadastrado.</div>
    <button class="btn full" onclick="abrirProduto(null,'${esc(c)}')">Cadastrar produto</button>`;return;}
  $('resLeitura').innerHTML=`<div class="card">${imgTag(CFG.bucketProd,p.foto)}
    <div class="info"><b>${esc(p.nome)}</b><span class="peq">${esc(p.codigo)}</span><br>Estoque atual: <b style="display:inline">${p.qtd??0}</b></div></div>
    <label>Movimentar quantidade (+ entrada / − saída)</label>
    <div class="linha"><input id="movQtd" type="number" inputmode="numeric" value="1">
    <button class="btn verde" style="flex:none" onclick="movimentar('${p.id}',1)">+</button>
    <button class="btn verm" style="flex:none" onclick="movimentar('${p.id}',-1)">−</button></div>`;
  preencherFotos();
}
async function movimentar(id,sinal){
  const p=estado.produtos.find(x=>x.id===id);
  p.qtd=(Number(p.qtd)||0)+sinal*(Number($('movQtd').value)||0);
  load(1);await salvar();load(0);buscarLeitura(p.codigo);renderTudo();
}

// ---------- CONTAGEM ----------
function mostrarNomeCont(){const p=porCodigo($('cCod').value);$('cNome').textContent=p?`${p.nome} — estoque: ${p.qtd??0}`:($('cCod').value?'Produto não cadastrado':'');}
async function registrarContagem(){
  const codigo=$('cCod').value.trim(),qtd=$('cQtd').value;
  if(!codigo||qtd===''){alert('Informe código e quantidade');return;}
  load(1);
  try{
    const p=porCodigo(codigo);const f=$('cFoto').files[0];
    const {data:u}=await sb.auth.getUser();
    const c={id:crypto.randomUUID(),data:new Date().toISOString(),codigo,nome:p?.nome||'(não cadastrado)',
      qtdContada:Number(qtd),qtdSistema:p?(Number(p.qtd)||0):null,obs:$('cObs').value.trim(),
      usuario:u?.user?.email||'',foto:f?await enviarFoto(CFG.bucketCont,f):null};
    estado.contagens.unshift(c);
    if(p&&$('cAplicar').checked)p.qtd=Number(qtd);
    await salvar();
    ['cCod','cQtd','cObs','cFoto'].forEach(i=>$(i).value='');$('cPrev').style.display='none';$('cNome').textContent='';
    renderContagens();renderTudo();
  }catch(e){alert('Erro: '+e.message);}
  load(0);
}
function renderContagens(){
  $('listaContagens').innerHTML=estado.contagens.length?estado.contagens.map(c=>{
    const dif=c.qtdSistema==null?'':` | Dif: ${c.qtdContada-c.qtdSistema}`;
    return `<div class="card">${imgTag(CFG.bucketCont,c.foto)}
      <div class="info"><b>${esc(c.nome)}</b><span class="peq">${esc(c.codigo)} · ${new Date(c.data).toLocaleString('pt-BR')} · ${esc(c.usuario)}</span><br>
      Contado: ${c.qtdContada} | Sistema: ${c.qtdSistema??'-'}${dif}${c.obs?'<br><span class="peq">'+esc(c.obs)+'</span>':''}</div>
      <button class="btn verm" onclick="excluirContagem('${c.id}')">🗑</button></div>`;}).join(''):'<p class="peq">Nenhuma contagem.</p>';
  preencherFotos();
}
async function excluirContagem(id){
  if(!confirm('Excluir esta contagem?'))return;
  const c=estado.contagens.find(x=>x.id===id);
  load(1);await apagarFoto(CFG.bucketCont,c?.foto);
  estado.contagens=estado.contagens.filter(x=>x.id!==id);await salvar();load(0);renderContagens();
}

// ---------- RELATÓRIOS ----------
async function fotoBase64(bucket,path){
  if(!path)return null;
  try{const b=await(await fetch(await urlFoto(bucket,path))).blob();
    return await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b);});}
  catch{return null;}
}
async function gerarPDF(titulo,cab,linhas){
  const {jsPDF}=window.jspdf;const doc=new jsPDF();
  doc.setFontSize(14);doc.text(titulo,14,15);doc.setFontSize(9);doc.text('Gerado em '+new Date().toLocaleString('pt-BR'),14,21);
  doc.autoTable({startY:26,head:[['Foto',...cab]],body:linhas.map(l=>['',...l.cols]),
    styles:{fontSize:8,valign:'middle'},bodyStyles:{minCellHeight:22},columnStyles:{0:{cellWidth:24}},
    didDrawCell:d=>{if(d.section==='body'&&d.column.index===0){const f=linhas[d.row.index].foto;
      if(f)doc.addImage(f,'JPEG',d.cell.x+2,d.cell.y+1,20,20);}}});
  doc.save(titulo+'.pdf');
}
async function gerarExcel(titulo,cab,linhas){
  const wb=new ExcelJS.Workbook();const ws=wb.addWorksheet('Relatório');
  ws.addRow(['Foto',...cab]).font={bold:true};
  ws.getColumn(1).width=14;cab.forEach((_,i)=>ws.getColumn(i+2).width=22);
  linhas.forEach((l,i)=>{const r=ws.addRow(['',...l.cols]);r.height=62;r.alignment={vertical:'middle'};
    if(l.foto){const id=wb.addImage({base64:l.foto,extension:'jpeg'});ws.addImage(id,{tl:{col:0,row:i+1},ext:{width:78,height:78}});}});
  const buf=await wb.xlsx.writeBuffer();
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  a.download=titulo+'.xlsx';a.click();
}
async function relProdutos(fmt){
  load(1);
  const linhas=await Promise.all(estado.produtos.map(async p=>({foto:await fotoBase64(CFG.bucketProd,p.foto),cols:[p.codigo,p.nome,p.qtd??0]})));
  const cab=['Código','Nome','Estoque'];
  fmt==='pdf'?await gerarPDF('Relatorio_Produtos',cab,linhas):await gerarExcel('Relatorio_Produtos',cab,linhas);
  load(0);
}
async function relContagens(fmt){
  load(1);
  const linhas=await Promise.all(estado.contagens.map(async c=>({foto:await fotoBase64(CFG.bucketCont,c.foto),
    cols:[new Date(c.data).toLocaleString('pt-BR'),c.codigo,c.nome,c.qtdContada,c.qtdSistema??'-',
      c.qtdSistema==null?'-':c.qtdContada-c.qtdSistema,c.usuario,c.obs]})));
  const cab=['Data','Código','Produto','Contado','Sistema','Diferença','Usuário','Obs'];
  fmt==='pdf'?await gerarPDF('Relatorio_Contagens',cab,linhas):await gerarExcel('Relatorio_Contagens',cab,linhas);
  load(0);
}
</script>
</body>
</html>
